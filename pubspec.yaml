name: glamii_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.2
  carousel_slider: ^5.0.0
  intl: ^0.19.0
  readmore: ^3.0.0
  flutter_svg: ^2.2.1
  get: ^4.7.2
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
     - assets/
     - assets/image/
     - assets/icons/
     - assets/language/
     - assets/notification.mp3

  fonts:
    - family: GiazaStencil
      fonts:
        - asset: assets/font/GiazaStencil.ttf
    - family: TTChocolates
      fonts:
        - asset: assets/font/TTChocolates.otf

